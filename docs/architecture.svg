<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Barlow, Helvetica, Arial, sans-serif" role="img" aria-label="CampusPulse architecture: sense, carry, analyse, decide">
  <title>CampusPulse architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1D2A30"/></marker>
    <pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#F4F5F2"/><line x1="0" y1="0" x2="0" y2="8" stroke="#3B6EA8" stroke-opacity=".25" stroke-width="3"/></pattern>
  </defs>
  <rect width="960" height="470" fill="#E4E7E3"/>
  <text x="32" y="44" font-size="22" font-weight="600" fill="#1D2A30">Sense, carry, analyse, decide: four layers, each one measurable</text>

  <g font-size="13" fill="#1D2A30">
    <!-- IoT -->
    <rect x="32" y="72" width="200" height="200" rx="4" fill="#F4F5F2" stroke="#1D2A30" stroke-width="2"/>
    <text x="48" y="100" font-size="17" font-weight="600">IoT · sense</text>
    <text x="48" y="126">ESP32 node in B-03</text>
    <text x="48" y="146">PIR motion</text>
    <text x="48" y="166">SCD40 CO₂, temp, humidity</text>
    <text x="48" y="186">Current clamp: watts</text>
    <text x="48" y="206">RSSI, reports sent / acked</text>
    <text x="48" y="236" fill="#5C6B71">+ 20 simulated rooms,</text>
    <text x="48" y="254" fill="#5C6B71">labelled simulated=true</text>

    <!-- Network -->
    <rect x="272" y="72" width="200" height="200" rx="4" fill="#F4F5F2" stroke="#1D2A30" stroke-width="2"/>
    <text x="288" y="100" font-size="17" font-weight="600">Network · carry</text>
    <text x="288" y="126">Campus Wi-Fi</text>
    <text x="288" y="146">MQTT QoS 1 to a broker</text>
    <text x="288" y="166">Bridge to HTTPS ingest</text>
    <text x="288" y="186">(or direct HTTPS)</text>
    <text x="288" y="206">Gateways gw-a, gw-b, gw-c</text>
    <text x="288" y="236" fill="#5C6B71">Lost acks and silent</text>
    <text x="288" y="254" fill="#5C6B71">gateways become data</text>

    <!-- Cloud -->
    <rect x="512" y="72" width="416" height="200" rx="4" fill="#F4F5F2" stroke="#1D2A30" stroke-width="2"/>
    <text x="528" y="100" font-size="17" font-weight="600">Google Cloud · analyse</text>
    <text x="528" y="126">Cloud Run: ingest + API + web app</text>
    <text x="528" y="146">Pub/Sub: telemetry topic (push)</text>
    <text x="528" y="166">BigQuery: readings, rooms, timetable</text>
    <text x="528" y="186">Curated views: hourly, empty-</text>
    <text x="528" y="204">cooled, attendance, network</text>
    <text x="528" y="230">BigQuery ML ARIMA_PLUS:</text>
    <text x="528" y="248">forecasts and energy anomalies</text>
    <text x="764" y="126">Decision engine</text>
    <text x="764" y="146">5 detectors, each</text>
    <text x="764" y="166">action costed in kWh</text>
    <text x="764" y="186">and ringgit, with its</text>
    <text x="764" y="204">SQL and rows attached</text>
    <text x="764" y="230">Confidence from the</text>
    <text x="764" y="248">network layer</text>
    <line x1="748" y1="112" x2="748" y2="258" stroke="#C3CAC5"/>

    <!-- Gemini -->
    <rect x="512" y="312" width="416" height="130" rx="4" fill="url(#h)" stroke="#3B6EA8" stroke-width="2.5"/>
    <text x="528" y="340" font-size="17" font-weight="600">Gemini on Vertex AI · decide</text>
    <text x="528" y="366">Daily brief from the engine’s actions, its numbers only</text>
    <text x="528" y="388">Ask the data: Gemini writes SQL by function calling,</text>
    <text x="528" y="406">a read-only guard checks it, BigQuery runs it</text>
    <text x="528" y="428" fill="#5C6B71">Offline fallback: template brief, 15 tested questions</text>

    <!-- Person -->
    <rect x="32" y="312" width="440" height="130" rx="4" fill="#F4F5F2" stroke="#1D2A30" stroke-width="2"/>
    <text x="48" y="340" font-size="17" font-weight="600">Estates manager · act</text>
    <text x="48" y="366">Floor plan: who is in, what is cooled while empty</text>
    <text x="48" y="388">Ranked changes with evidence; approve or dismiss</text>
    <text x="48" y="410">Every decision logged back to BigQuery</text>
    <text x="48" y="430" fill="#5C6B71">Room drawer: last 48 h and tomorrow's forecast</text>
  </g>

  <g fill="none" stroke="#1D2A30" stroke-width="1.6">
    <path d="M232 172H268" marker-end="url(#a)"/>
    <path d="M472 172H508" marker-end="url(#a)"/>
    <path d="M720 272V308" marker-end="url(#a)"/>
    <path d="M512 377H476" marker-end="url(#a)"/>
    <path d="M820 312V276" marker-end="url(#a)"/>
  </g>
  <text x="728" y="295" font-size="12" fill="#5C6B71">actions + rows</text>
  <text x="828" y="295" font-size="12" fill="#5C6B71">SQL</text>
</svg>
